<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Gateway Admin Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        /* Custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1f2937;
        }

        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        /* Animation classes */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(2rem);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .animate-fadeIn {
            animation: fadeIn 0.3s;
        }

        .animate-slideUp {
            animation: slideUp 0.3s;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100">
    <div id="app"></div>

    <!-- Vue 2 from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <!-- Axios for HTTP requests -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- Application Scripts -->
    <script src="./js/store.js"></script>
    <script src="./js/components/header.js"></script>
    <script src="./js/components/sidebar.js"></script>
    <script src="./js/components/login.js"></script>
    <script src="./js/components/dashboard.js"></script>
    <script src="./js/components/routes.js"></script>
    <script src="./js/components/route-details.js"></script>
    <script src="./js/components/audit.js"></script>
    <script src="./js/components/health.js"></script>
    <script src="./js/components/modal.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
